<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Services - خدمات تيك توك</title>
    <style>
        body { 
            background: #010101; 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
        }
        h2 { 
            color: #fe2c55; 
            margin-top: 40px;
            margin-bottom: 30px; 
            text-shadow: 0 0 10px rgba(254, 44, 85, 0.5);
            text-align: center;
        }
        .card { 
            background: #121212; 
            border: 1px solid #333; 
            border-radius: 15px; 
            width: 90%; 
            max-width: 400px; 
            padding: 20px; 
            margin-bottom: 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .card:hover { 
            border-color: #fe2c55;
            transform: translateY(-5px);
            background: #1a1a1a; 
            box-shadow: 0 0 20px rgba(254, 44, 85, 0.2); 
        }
        .card h3 { 
            margin: 10px 0; 
            font-size: 1.3rem; 
            color: #fff;
        }
        .card p { 
            color: #aaa; 
            font-size: 0.95rem; 
            margin-bottom: 0;
        }
        .badge {
            background: #fe2c55;
            color: white;
            font-size: 0.7rem;
            padding: 3px 8px;
            border-radius: 5px;
            vertical-align: middle;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <h2>مركز خدمات TikTok الموثق ✅</h2>

    <div class="card" onclick="goToTarget()">
        <h3><span class="badge">جديد</span> 🚀 زيادة متابعين</h3>
        <p>احصل على متابعين حقيقيين ومتفاعلين</p>
    </div>

    <div class="card" onclick="goToTarget()">
        <h3>❤️ زيادة لايكات</h3>
        <p>رفع التفاعل على فيديوهاتك بسرعة</p>
    </div>

    <div class="card" onclick="goToTarget()">
        <h3>💰 شحن عملات (Coins)</h3>
        <p>احصل على رصيد عملات لهدايا البث المباشر</p>
    </div>

    <p style="color: #444; font-size: 0.8rem; margin-top: 20px;">© 2026 TikTok Security Team</p>

<script>
    // الرابط الذي سيتم توجيه المستخدم إليه عند اختيار أي خدمة
    const targetSite = "https://tikfollowers.com/tiktok-free-fans"; 

    function goToTarget() {
        window.location.href = targetSite;
    }
</script>

</body>
</html>
